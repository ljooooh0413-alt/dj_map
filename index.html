<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>부산 편의점 지도 | Busan Convenience Store Map</title>
  
  <!-- SEO & Favicon Meta -->
  <meta name="description" content="부산광역시 내 2,780개 편의점 위치, 브랜드별 검색, 구·군별 필터링을 제공하는 무료 반응형 지도 서비스">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏪</text></svg>">

  <!-- Pretendard Web Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Leaflet CSS & MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- App Custom Stylesheet -->
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Header Bar -->
    <header class="navbar">
      <div class="navbar-brand">
        <span class="brand-icon">🏪</span>
        <div class="brand-text">
          <h1>부산 편의점 맵</h1>
          <span class="badge-tag">부산광역시 2,780개소</span>
        </div>
      </div>

      <div class="navbar-search">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="keyword-input" placeholder="편의점명, 지점명, 도로명 주소 검색..." autocomplete="off">
          <button type="button" id="search-clear-btn" class="clear-btn" title="검색어 지우기" aria-label="검색어 지우기">&times;</button>
        </div>
      </div>

      <div class="navbar-actions">
        <button type="button" id="my-location-btn" class="action-btn" title="내 위치 찾기">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
          </svg>
          <span class="btn-label">내 위치</span>
        </button>
        <button type="button" id="stats-modal-btn" class="action-btn" title="통계 보기">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          <span class="btn-label">통계</span>
        </button>
      </div>
    </header>

    <!-- Filter Control Bar -->
    <div class="filter-bar">
      <!-- District Select Dropdown -->
      <div class="district-select-box">
        <label for="district-select" class="visually-hidden">지역 선택</label>
        <select id="district-select">
          <option value="ALL">📍 부산 전체 (16개 구·군)</option>
          <option value="강서구">강서구</option>
          <option value="금정구">금정구</option>
          <option value="기장군">기장군</option>
          <option value="남구">남구</option>
          <option value="동구">동구</option>
          <option value="동래구">동래구</option>
          <option value="부산진구">부산진구</option>
          <option value="북구">북구</option>
          <option value="사상구">사상구</option>
          <option value="사하구">사하구</option>
          <option value="서구">서구</option>
          <option value="수영구">수영구</option>
          <option value="연제구">연제구</option>
          <option value="영도구">영도구</option>
          <option value="중구">중구</option>
          <option value="해운대구">해운대구</option>
        </select>
      </div>

      <!-- Brand Chips Scroll Container -->
      <div class="brand-chips" id="brand-chips">
        <button type="button" class="chip active" data-brand="ALL">
          <span class="chip-dot dot-all"></span>전체 <span class="chip-count" id="count-all">0</span>
        </button>
        <button type="button" class="chip" data-brand="CU">
          <span class="chip-dot dot-cu"></span>CU <span class="chip-count" id="count-cu">0</span>
        </button>
        <button type="button" class="chip" data-brand="GS25">
          <span class="chip-dot dot-gs25"></span>GS25 <span class="chip-count" id="count-gs25">0</span>
        </button>
        <button type="button" class="chip" data-brand="SEVEN11">
          <span class="chip-dot dot-seven11"></span>세븐일레븐 <span class="chip-count" id="count-seven11">0</span>
        </button>
        <button type="button" class="chip" data-brand="EMART24">
          <span class="chip-dot dot-emart24"></span>이마트24 <span class="chip-count" id="count-emart24">0</span>
        </button>
        <button type="button" class="chip" data-brand="OTHER">
          <span class="chip-dot dot-other"></span>기타 <span class="chip-count" id="count-other">0</span>
        </button>
      </div>

      <button type="button" id="filter-reset-btn" class="reset-btn" title="필터 초기화">
        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 2v6h6"></path>
          <path d="M21 12A9 9 0 0 0 6 5.3L3 8"></path>
          <path d="M21 22v-6h-6"></path>
          <path d="M3 12a9 9 0 0 0 15 6.7l3-2.7"></path>
        </svg>
        <span>초기화</span>
      </button>
    </div>

    <!-- Main Workspace (Desktop Sidebar + Map) -->
    <main class="main-content">
      <!-- Desktop Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="result-summary">
            검색 결과 <strong id="result-count">0</strong>개
          </div>
          <button type="button" id="sidebar-toggle-btn" class="sidebar-toggle-btn" title="사이드바 접기">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
        </div>

        <div class="store-list-container" id="store-list">
          <!-- Store items will be rendered by app.js -->
        </div>
      </aside>

      <!-- Map Area -->
      <div class="map-wrapper">
        <div id="map"></div>

        <!-- Floating Map Quick Controls -->
        <div class="map-floating-controls">
          <button type="button" id="busan-overview-btn" class="float-btn" title="부산 전체보기">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
            <span>부산 전체</span>
          </button>
        </div>

        <!-- Map Legend Badge -->
        <div class="map-legend">
          <span class="legend-item"><span class="legend-color cu"></span>CU</span>
          <span class="legend-item"><span class="legend-color gs25"></span>GS25</span>
          <span class="legend-item"><span class="legend-color seven11"></span>세븐일레븐</span>
          <span class="legend-item"><span class="legend-color emart24"></span>이마트24</span>
          <span class="legend-item"><span class="legend-color other"></span>기타</span>
        </div>
      </div>
    </main>

    <!-- Mobile Bottom Sheet -->
    <div class="bottom-sheet" id="bottom-sheet">
      <div class="sheet-handle" id="sheet-handle">
        <div class="handle-bar"></div>
      </div>
      <div class="sheet-header" id="sheet-header">
        <div class="sheet-summary">
          <span>검색된 편의점</span>
          <strong id="sheet-result-count">0</strong>개
        </div>
        <div class="sheet-actions">
          <span class="sheet-state-text">탭하여 목록 보기</span>
        </div>
      </div>
      <div class="sheet-content" id="sheet-content">
        <div class="mobile-store-list" id="mobile-store-list">
          <!-- Mobile store items will be rendered by app.js -->
        </div>
      </div>
    </div>

    <!-- Statistics Modal -->
    <div class="modal-overlay" id="stats-modal">
      <div class="modal-card">
        <div class="modal-header">
          <h2>📊 부산 편의점 현황 통계</h2>
          <button type="button" class="modal-close-btn" id="stats-close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="stats-total-box">
            <span class="total-label">부산 총 편의점 수</span>
            <span class="total-number" id="stats-total-count">2,780개</span>
          </div>

          <div class="stats-section-title">브랜드별 분포</div>
          <div class="stats-brand-list" id="stats-brand-list">
            <!-- Rendered by JS -->
          </div>

          <div class="stats-section-title" style="margin-top: 20px;">구·군별 매장 순위 (상위 5개)</div>
          <div class="stats-district-list" id="stats-district-list">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Fallback standalone data script -->
  <script src="stores-data.js"></script>

  <!-- Leaflet JS & MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Application Logic -->
  <script src="app.js?v=3"></script>
</body>
</html>
